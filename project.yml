name: MobaXTerm
options:
  bundleIdPrefix: local.mobaxterm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3
targets:
  MobaXTerm:
    type: application
    platform: macOS
    sources:
      - path: MobaXTerm
        excludes:
          - Info.plist
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.mobaxterm.macos
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MobaXTerm/Info.plist
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_APP_SANDBOX: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  MobaXTermTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MobaXTermTests
    dependencies:
      - target: MobaXTerm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.mobaxterm.macos.tests
  MobaXTermUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MobaXTermUITests
    dependencies:
      - target: MobaXTerm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.mobaxterm.macos.uitests
schemes:
  MobaXTerm:
    build:
      targets:
        MobaXTerm: all
        MobaXTermTests: [test]
        MobaXTermUITests: [test]
    run:
      config: Debug
    test:
      targets:
        - MobaXTermTests
        - MobaXTermUITests
